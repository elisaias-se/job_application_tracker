{% extends 'base.html' %}{% block content %}<h1>{{ title }}?</h1><div class="panel form-panel"><p>Delete <strong>{{ record[config.label] }}</strong>? This action cannot be undone.</p><p class="muted">Records with dependent jobs, applications, or contacts must have those dependencies removed first.</p><form method="post" class="actions-row"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger">Confirm deletion</button><a href="{{ url_for('main.detail', entity=entity, record_id=record[config.pk]) }}">Cancel</a></form></div>{% endblock %}
