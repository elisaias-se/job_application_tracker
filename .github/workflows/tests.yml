name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-test-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pintegration-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      MYSQL_TEST_ENABLE: '1'
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: integration-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
